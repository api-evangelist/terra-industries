name: Terra Industries
description: >-
  Terra Industries is a Nigeria-based defense-technology company, positioning itself as
  Africa's first defense prime, that designs, manufactures, and deploys autonomous multi-domain
  security systems across air, land, and eventually sea. Founded in 2024 by Nathan Nwachuku and
  Maxwell Maduka, the company builds ArtemisOS (an AI-powered operating system for infrastructure
  security), the Archer long-range VTOL surveillance drone, the Iroko modular UAV, the Duma
  autonomous unmanned ground vehicle, and the Kallon solar-powered AI sentry tower to monitor,
  detect, and respond to threats such as terrorism, sabotage, and armed attacks on critical
  infrastructure including hydropower plants, mines, and power assets. Terra raised $11.75M led
  by 8VC in January 2026. As a hardware and defense-systems manufacturer it publishes no public
  API, developer portal, or technical documentation surface; this profile is maintained as a
  company/provider record in the API Evangelist network.
